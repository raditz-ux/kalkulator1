<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kalkulator Modern</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #c3ecf4, #a2d4ec);
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .calculator {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 30px;
      width: 320px;
      box-shadow: 0 8px 32px rgba(31, 38, 135, 0.3);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    h2 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 20px;
    }

    input[type="number"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      outline: none;
      background-color: #ffffffcc;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    button {
      padding: 12px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s ease;
      background-color: #3498db;
      color: white;
    }

    button:hover {
      background-color: #2980b9;
      transform: scale(1.05);
    }

    .result {
      margin-top: 20px;
      padding: 12px;
      background-color: #ffffffcc;
      border-radius: 8px;
      font-size: 18px;
      text-align: center;
      color: #2c3e50;
    }

    .error {
      color: #e74c3c;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <h2>Kalkulator Modern</h2>
    <input type="number" id="angka1" placeholder="Masukkan angka pertama">
    <input type="number" id="angka2" placeholder="Masukkan angka kedua">

    <div class="buttons">
      <button onclick="hitung('+')">+</button>
      <button onclick="hitung('-')">−</button>
      <button onclick="hitung('*')">×</button>
      <button onclick="hitung('/')">÷</button>
    </div>

    <div id="hasil" class="result"></div>
  </div>

  <script>
    function hitung(operator) {
      const angka1 = document.getElementById('angka1').value;
      const angka2 = document.getElementById('angka2').value;
      const hasilDiv = document.getElementById('hasil');

      if (angka1 === '' || angka2 === '') {
        hasilDiv.innerHTML = '<span class="error">Masukkan kedua angka!</span>';
        return;
      }

      const num1 = parseFloat(angka1);
      const num2 = parseFloat(angka2);

      if (isNaN(num1) || isNaN(num2)) {
        hasilDiv.innerHTML = '<span class="error">Input harus berupa angka yang valid.</span>';
        return;
      }

      let hasil;

      switch(operator) {
        case '+':
          hasil = num1 + num2;ss
          break;
        case '-':
          hasil = num1 - num2;
          break;
        case '*':
          hasil = num1 * num2;
          break;
        case '/':
          if (num2 === 0) {
            hasilDiv.innerHTML = '<span class="error">Tidak dapat membagi dengan nol!</span>';
            return;
          }
          hasil = num1 / num2;
          break;
        default:
          hasilDiv.innerHTML = '<span class="error">Operasi tidak dikenal.</span>';
          return;
      }

      hasilDiv.innerHTML = `Hasil: ${hasil}`;
    }
  </script>
</body>
</html>
